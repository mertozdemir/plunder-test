# On the VPS: docker compose up -d
# Needs DNS: livekit.example.com and turn.example.com -> VPS IP.
# Open ports: 80, 443/tcp, 7881/tcp, 3478/udp, 5349/tcp, 50000-60000/udp.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
  caddy:
    # TLS for wss://livekit.example.com -> localhost:7880
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
