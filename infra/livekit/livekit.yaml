# Self-hosted LiveKit on the VPS (Railway has no UDP, so media lives here).
port: 7880
bind_addresses: [""]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  enabled: true
  domain: turn.example.com        # TURN/TLS on 443 helps phones on strict networks
  tls_port: 5349
  udp_port: 3478
keys:
  # Generate with: docker run --rm livekit/livekit-server generate-keys
  # Same pair goes into the Railway token service env.
  REPLACE_API_KEY: REPLACE_API_SECRET
room:
  empty_timeout: 300
  max_participants: 50
logging:
  level: info
